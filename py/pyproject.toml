[project]
name = "eotcdev-api"
version = "0.1.0"
description = "Open REST API for the Ethiopian Orthodox Tewahedo Church calendar."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.4,<4.9",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eotc"]

[tool.setuptools.package-data]
eotc = ["gitsawe_catalog.js", "sinq_catalog.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
