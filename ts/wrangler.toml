name = "eotcdev-api"
main = "src/index.ts"
compatibility_date = "2026-08-27"

# The application remains database-free. Cloudflare's native, edge-local limiter
# protects the anonymous public endpoint without adding a storage service.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 600
  period = 60

[vars]
RATE_LIMIT_CAPACITY = "60"
RATE_LIMIT_REFILL_PER_SECOND = "10"

[observability]
enabled = true
